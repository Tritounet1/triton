name: macOS release validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.9"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app-desktop/pnpm-lock.yaml
      - name: Install dependencies
        run: |
          uv sync --all-groups
          pnpm --dir app-desktop install --frozen-lockfile
      - name: Verify macOS Keychain command is available
        run: security help >/dev/null
      - name: Build bundled Python sidecar
        run: ./packaging/build_server.sh
      - name: Build packaged desktop application
        run: pnpm --dir app-desktop tauri build
