[project]
name = "harness"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "mcp>=2.1.1",
    "openai>=3.5.0",
    "prompt-toolkit>=3.0.53",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.10",
    "pre-commit>=4.6.2",
    "ruff>=0.16.5",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# "›" est utilise volontairement dans le prompt CLI (main.py), pas une faute
allowed-confusables = ["›"]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (unused imports/vars, undefined names...)
    "I",   # isort (import sorting)
    "UP",  # pyupgrade (modern syntax)
    "B",   # flake8-bugbear (common bug patterns)
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "A",   # flake8-builtins (no shadowing read/list/dict/...)
    "RUF", # ruff-specific rules
]
# frameworks (FastAPI's Depends(), MCP's decorators) commonly use mutable
# default arguments / call expressions in signatures by design
ignore = ["B008"]

[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
include = ["."]
exclude = [".venv", "app-desktop"]
